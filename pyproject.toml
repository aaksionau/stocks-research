[project]
name = "stocks-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aliaksei Aksionau", email = "alexei.aksenov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.2",
]

# Split so the pipeline and web UI Docker images each install only what they
# need (see docker/pipeline.Dockerfile / docker/web.Dockerfile) -- the pipeline
# never needs streamlit, the web UI never needs yfinance/openai.
[project.optional-dependencies]
pipeline = [
    "openai>=2.53.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "requests>=2.32.0",
    "yfinance>=1.5.2",
]
web = [
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "streamlit>=1.60.0",
]

[project.scripts]
stocks-research = "stocks_research:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
